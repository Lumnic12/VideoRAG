# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Semantic Video Synthesizer — Single-Command Deployment                    ║
# ║                                                                            ║
# ║  Prerequisites (run ONCE before first launch):                            ║
# ║    1. Install Docker Desktop  → https://www.docker.com/products/docker-desktop ║
# ║    2. Install Ollama          → https://ollama.com                        ║
# ║    3. ollama pull gemma3:1b                                                ║
# ║       ollama pull nomic-embed-text                                        ║
# ║       ollama pull moondream                                               ║
# ║                                                                            ║
# ║  Launch everything:                                                        ║
# ║    docker compose up --build                                               ║
# ║                                                                            ║
# ║  Then open → http://localhost:3000                                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:

  # ── 1. Redis — Message broker & result store ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: svs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── 2. Backend API — FastAPI + uvicorn ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: final
    image: svs-backend:latest
    container_name: svs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Infrastructure
      REDIS_URL: redis://redis:6379/0
      # Storage (persisted in named volume)
      UPLOAD_DIR: /app/data/uploads
      KEYFRAME_DIR: /app/data/keyframes
      FAISS_INDEX_PATH: /app/data/faiss_index
      # Ollama — connects to host machine where `ollama serve` is running
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      # Pipeline tuning
      SSIM_THRESHOLD: ${SSIM_THRESHOLD:-0.95}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  # ── 3. Celery Worker — Video processing pipeline ──────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: final
    image: svs-backend:latest          # reuse the same built image — no second build
    container_name: svs-worker
    restart: unless-stopped
    command: >
      celery -A services.task_orchestrator worker
      --loglevel=info
      --concurrency=2
      --hostname=svs-worker@%h
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      KEYFRAME_DIR: /app/data/keyframes
      FAISS_INDEX_PATH: /app/data/faiss_index
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      SSIM_THRESHOLD: ${SSIM_THRESHOLD:-0.95}
    volumes:
      - app_data:/app/data          # shares uploads/keyframes/index with backend
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── 4. Frontend — Vite/React built & served via nginx ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # nginx reverse-proxies /api → backend:8000, so the frontend just uses /api
        VITE_API_BASE: ""
    image: svs-frontend:latest
    container_name: svs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3


# ── Named volumes (persistent across restarts) ────────────────────────────────
volumes:
  redis_data:
    driver: local
  app_data:
    driver: local
