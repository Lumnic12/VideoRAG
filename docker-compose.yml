# docker-compose.yml — Semantic Video Synthesizer
# Full-stack: Redis + Backend API + Celery Worker + Frontend (nginx)
#
# Usage:
#   docker compose up --build           # first run — builds all images
#   docker compose up                   # subsequent runs (cached images)
#   docker compose up --scale worker=2  # run 2 parallel workers
#   docker compose logs -f backend      # tail backend logs
#   docker compose down -v              # stop + remove volumes
#
# Environment:
#   Copy .env.example → .env and fill in API keys before starting.
#   Required: DEEPGRAM_API_KEY, OPENAI_API_KEY, HF_API_TOKEN

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: svs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend API (FastAPI + uvicorn) ─────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: final
    container_name: svs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override path settings to use Docker volume mount paths
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      KEYFRAME_DIR: /app/data/keyframes
      FAISS_INDEX_PATH: /app/data/faiss_index
    volumes:
      # Persist uploaded videos, extracted keyframes, and FAISS index
      - app_data:/app/data
      # Hot-reload source on dev (comment out for prod)
      # - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Celery Worker ───────────────────────────────────────────────────────────
  # Runs the same image as backend but with a different CMD.
  # On Linux (Docker), uses default prefork pool — pool=solo NOT needed here.

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: final
    container_name: svs-worker
    restart: unless-stopped
    # prefork pool with 2 concurrent task slots
    command: >
      celery -A services.task_orchestrator worker
      --loglevel=info
      --concurrency=2
      --hostname=svs-worker@%h
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      KEYFRAME_DIR: /app/data/keyframes
      FAISS_INDEX_PATH: /app/data/faiss_index
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── Celery Beat (optional — for scheduled tasks) ────────────────────────────
  # Uncomment if you add periodic tasks (e.g., index cleanup, health reports).
  #
  # beat:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #     target: final
  #   command: celery -A services.task_orchestrator beat --loglevel=info
  #   env_file: [.env]
  #   environment:
  #     REDIS_URL: redis://redis:6379/0
  #   depends_on: [redis]

  # ── Flower — Celery monitoring UI (dev only) ────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: svs-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - dev       # only starts with: docker compose --profile dev up

  # ── Frontend (nginx serving Vite build) ────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: svs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3


# ── Named volumes ───────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  app_data:
    driver: local


# ── Networks ────────────────────────────────────────────────────────────────
# Default bridge network — all services can reach each other by service name.
# frontend → backend:8000  (nginx proxy_pass)
# backend  → redis:6379
# worker   → redis:6379
