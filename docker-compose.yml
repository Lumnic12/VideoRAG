# docker-compose.yml — Semantic Video Synthesizer (Production)
# 100% LOCAL: Ollama LLM + Windows OCR + Whisper + FAISS
#
# Usage:
#   docker compose up --build           # first run — builds all images
#   docker compose up -d                # run in background
#   docker compose logs -f backend      # tail backend logs
#   docker compose down                 # stop all services
#   docker compose --profile monitoring up  # include Flower UI
#
# Prerequisites:
#   - Ollama running on host: ollama serve
#   - Models pulled: ollama pull gemma3:1b && ollama pull nomic-embed-text

services:

  # ── Redis — Message broker + result store ──────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: svs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend API (FastAPI + uvicorn) ─────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: final
    container_name: svs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      KEYFRAME_DIR: /app/data/keyframes
      FAISS_INDEX_PATH: /app/data/faiss_index
      # Connect to Ollama running on the host machine
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: gemma3:1b
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Celery Worker — Video processing pipeline ──────────────────────────────

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: final
    container_name: svs-worker
    restart: unless-stopped
    command: >
      celery -A services.task_orchestrator worker
      --loglevel=info
      --concurrency=2
      --hostname=svs-worker@%h
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      KEYFRAME_DIR: /app/data/keyframes
      FAISS_INDEX_PATH: /app/data/faiss_index
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: gemma3:1b
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Frontend (nginx serving Vite build) ────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: svs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Flower — Celery monitoring (optional) ──────────────────────────────────

  flower:
    image: mher/flower:2.0
    container_name: svs-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - monitoring


# ── Named volumes ───────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  app_data:
    driver: local
